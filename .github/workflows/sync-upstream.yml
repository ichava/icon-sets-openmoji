# .github/workflows/sync-upstream.yml
#
# Drop-in template for any Ichava icon pack that wants automated
# upstream-asset refreshes. Builds the ichava/icon-sets-sync docker image
# (the Go binary, with git, gh and Node) from the toolkit's main branch and
# opens a PR when upstream has moved.
#
# A human reviews the PR diff and merges. release-please then opens the
# release PR, and its tag starts release.yml, which publishes the GitHub
# release. Packagist reads the tag and lists the new version.
#
# Required:
#   Refresh Bot (REFRESH_APP_CLIENT_ID / REFRESH_APP_PRIVATE_KEY, org level; a
#   private repo needs repository copies) for the push and the PR. The
#   organisation does not let GITHUB_TOKEN create pull requests, so a sync PR
#   opened with it fails with "GitHub Actions is not permitted to create or
#   approve pull requests".

name: Sync upstream

on:
  schedule:
    # Mondays 06:45 UTC. 45-past-the-hour offset borrowed from Homebrew's
    # autobump cron to dodge GitHub Actions' on-the-hour load spike.
    - cron: '45 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh even when current == latest (dev / debugging)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # The sync opens its PR with GITHUB_TOKEN, and GitHub deliberately does not
  # start workflow runs for events created with that token -- so the PR arrives
  # with zero checks and reads as `unstable` rather than as failing. We cannot
  # trigger the normal suite from here; we can attach a real commit status.
  statuses: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pack repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout ichava/icon-sets-sync (the toolkit)
        uses: actions/checkout@v7
        with:
          repository: ichava/icon-sets-sync
          path: .icon-sets-sync
          # Pin to a tag in production. Floating on main is fine for
          # the cron itself -- this is the maintainer's own tooling.
          ref: main

      - name: Configure git identity (commits go through this name)
        run: |
          git config user.name  "ichava-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A per-run Refresh Bot token, so the PR can be opened at all (GITHUB_TOKEN
      # may not create pull requests here) and its checks start like any other.
      - name: Mint the Refresh Bot token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Authenticate gh for PR creation
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      # Build from the toolkit checkout instead of pulling ghcr.io — the
      # GHCR package is private and other repos' GITHUB_TOKENs cannot pull
      # it; the source is already checked out one step above.
      - name: Build icon-sets-sync image
        run: docker build -t icon-sets-sync:local .icon-sets-sync

      - name: Run icon-sets-sync via Docker
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PACK_SLUG: ${{ github.event.repository.name }}
        run: |
          # An array, not a string: $FLAGS unquoted relies on word-splitting to
          # expand to nothing when empty, and quoting it would pass an empty
          # argument instead. "${FLAGS[@]}" does both correctly.
          FLAGS=()
          if [ "${{ inputs.force }}" = "true" ]; then FLAGS+=(--force); fi

          # The push happens INSIDE the container. `gh auth setup-git` ran on
          # the runner, and actions/checkout leaves its credential in a file
          # under RUNNER_TEMP that is not mounted here, so the container had no
          # way to authenticate: `git push` exited 128 at the GitBranch stage,
          # after a full and successful asset refresh. Hand it the same
          # Authorization header actions/checkout uses. GH_TOKEN is masked in
          # logs, and so is anything derived from it.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          docker run --rm \
            -v "$PWD/..:/work" \
            -v "$PWD/.icon-sets-sync/config:/app/config" \
            -e GH_TOKEN \
            -e GIT_CONFIG_COUNT=2 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            -e GIT_CONFIG_KEY_1='http.https://github.com/.extraheader' \
            -e GIT_CONFIG_VALUE_1="$AUTH_HEADER" \
            icon-sets-sync:local \
            sync --pack="$PACK_SLUG" "${FLAGS[@]}"

      # Without this the sync PR has no checks at all: see the note on
      # `statuses: write` above. Run the suite against whatever the sync just
      # pushed and attach the verdict to that commit, so the PR shows a real
      # pass/fail instead of silence.
      # The verify step runs Composer on the runner itself, so it needs the
      # PHP the package requires and a token for the `vcs` repositories in
      # composer.json. Without either, `composer update` fails with "Could not
      # authenticate against github.com" and the suite never runs.
      - name: Set up PHP for verification
        if: success()
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Verify the synced branch and report a commit status
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          set -euo pipefail

          # `gh pr list` has no prefix filter -- only exact --head -- so list
          # the open PRs and select by prefix here.
          PR_JSON=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName,headRefOid --limit 50 \
            --jq '[.[] | select(.headRefName | startswith("chore/sync-upstream"))]' \
            2>/dev/null || echo '[]')
          if [ "$(printf '%s' "$PR_JSON" | jq 'length')" -eq 0 ]; then
            echo "No sync PR open -- nothing to verify."
            exit 0
          fi

          REF=$(printf '%s' "$PR_JSON" | jq -r '.[0].headRefName')
          SHA=$(printf '%s' "$PR_JSON" | jq -r '.[0].headRefOid')
          echo "Verifying $REF at $SHA"

          post_status() {
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state="$1" -f context='Sync verification' -f description="$2" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          }

          post_status pending 'Running the suite against the synced content'

          git fetch origin "$REF"
          git checkout -q "$SHA"

          if composer update --prefer-stable --prefer-dist --no-interaction --no-progress \
             && vendor/bin/pest; then
            post_status success 'Suite passed on the synced content'
          else
            post_status failure 'Suite failed on the synced content'
            echo "::error::The synced content does not pass this package's suite. Do not merge $REF."
            exit 1
          fi

      - name: Clean up
        if: always()
        run: rm -rf .icon-sets-sync
